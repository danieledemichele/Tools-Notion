<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Travel Planner — Globo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2;
    --land:#c3d6cd;
    --land-line:#aac2b8;
    --grid:#e1e5ea;
    --ink:#16181c;
    --ink-dim:#8b8f97;
    --accent:#ff6f4d;
    --accent-soft:#ffb8a3;
    --card-bg:#ffffff;
    --chip-bg:#ffe6de;
    --chip-ink:#e05a3a;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font);color:var(--ink);}
  #stage{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
  svg{cursor:grab;}
  svg:active{cursor:grabbing;}

  .sphere-shadow{filter:drop-shadow(0 30px 40px rgba(20,30,40,0.12));}
  .graticule{fill:none;stroke:var(--grid);stroke-width:0.6;}
  .land{fill:var(--land);stroke:var(--land-line);stroke-width:0.5;}

  .marker{cursor:pointer;}
  .marker .halo{fill:var(--accent);opacity:0.18;}
  .marker .core{
    fill:var(--accent-soft);
    stroke:#fff;
    stroke-width:1.5;
    transition:fill 0.15s ease;
  }
  .marker.active .core{fill:var(--accent);}
  .marker:hover .core{fill:var(--accent);}

  header{position:absolute;top:26px;left:28px;z-index:10;}
  header h1{font-size:15px;font-weight:600;margin:0 0 2px 0;color:var(--ink);}
  header p{font-size:12px;color:var(--ink-dim);margin:0;}
  #dataSource{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}

  #card{
    position:absolute;
    width:300px;
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:0 20px 50px rgba(20,30,40,0.16), 0 2px 8px rgba(20,30,40,0.06);
    padding:22px 24px 18px 24px;
    z-index:20;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity 0.18s ease, transform 0.18s ease;
  }
  #card.visible{opacity:1;transform:translateY(0);pointer-events:auto;}

  #card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  #card h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  #card .country{font-size:13px;color:var(--ink-dim);margin-top:2px;}
  #card .chip{
    flex:none;font-size:10.5px;font-weight:700;letter-spacing:0.03em;
    color:var(--chip-ink);background:var(--chip-bg);
    padding:5px 9px;border-radius:20px;text-transform:uppercase;
    white-space:nowrap;
  }

  #card .stats{display:flex;gap:28px;margin-top:16px;}
  #card .stat-label{font-size:11px;color:var(--ink-dim);margin-bottom:3px;}
  #card .stat-value{font-size:19px;font-weight:700;}

  #card .section-label{
    font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--ink-dim);margin-top:18px;margin-bottom:8px;
  }
  #card .bar{display:flex;width:100%;height:7px;border-radius:4px;overflow:hidden;margin-bottom:12px;}
  #card .bar span{height:100%;}

  #card .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  #card .legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;}
  #card .legend-item .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  #card .legend-item .val{margin-left:auto;color:var(--ink-dim);}

  #card .footnote{margin-top:14px;font-size:10.5px;color:var(--ink-dim);font-style:italic;}

  #hint{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--ink-dim);z-index:10;
  }

  #loading{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:12px;color:var(--ink-dim);z-index:5;
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>Travel Planner</h1>
    <p id="cityCount">— città in itinerario</p>
    <p id="dataSource"></p>
  </header>
  <div id="loading">Carico le città…</div>
  <svg></svg>
  <div id="card"></div>
  <div id="hint">trascina per ruotare · pizzica per zoom · clicca un punto per i dettagli</div>
</div>

<script>
/* ---------------------------------------------------------
   Collega qui l'URL del tuo Worker una volta deployato, es.
   "https://travel-planner.tuosottodominio.workers.dev"
   Finché resta vuoto, la pagina usa i dati di esempio qui sotto
   (utile per continuare a vedere l'anteprima anche offline).
   ------------------------------------------------------- */
const WORKER_URL = "https://travel-planner.daniele-470.workers.dev"; // <-- incolla qui l'URL del Worker deployato, senza slash finale

const TYPE_COLORS = {
  "Sightseeing": "#3b7cf0",
  "Food":        "#f0a63b",
  "Museum":      "#9b6bf0",
  "Shopping":    "#3bc99a",
  "Transport":   "#f06b8f"
};

// Usati solo se WORKER_URL non è impostato o la fetch fallisce.
const MOCK_CITIES = [
  { city:"London", country:"United Kingdom", lat:51.5074, lng:-0.1278,
    firstVisit:"2024", activities:12,
    types:[["Sightseeing",45],["Food",25],["Museum",20],["Shopping",10]] },
  { city:"Paris", country:"France", lat:48.8566, lng:2.3522,
    firstVisit:"2023", activities:18,
    types:[["Sightseeing",35],["Food",30],["Museum",25],["Shopping",10]] },
  { city:"Tokyo", country:"Japan", lat:35.6762, lng:139.6503,
    firstVisit:"2025", activities:9,
    types:[["Food",40],["Sightseeing",30],["Shopping",20],["Transport",10]] },
  { city:"New York", country:"United States", lat:40.7128, lng:-74.0060,
    firstVisit:"2022", activities:6,
    types:[["Sightseeing",50],["Shopping",30],["Food",20]] },
  { city:"Cagliari", country:"Italy", lat:39.2238, lng:9.1217,
    firstVisit:"2021", activities:22,
    types:[["Food",35],["Sightseeing",35],["Transport",15],["Museum",15]] }
];

async function loadCities(){
  const statusEl = document.getElementById('dataSource');
  if (!WORKER_URL) {
    statusEl.textContent = 'dati di esempio — imposta WORKER_URL per i dati live';
    return MOCK_CITIES;
  }
  try {
    const res = await fetch(WORKER_URL + '/cities');
    if (!res.ok) throw new Error('risposta non ok: ' + res.status);
    const data = await res.json();
    const valid = Array.isArray(data) ? data.filter(d => d.lat != null && d.lng != null) : [];
    if (!valid.length) throw new Error('nessuna città valida ricevuta');
    statusEl.textContent = 'dati live da Notion';
    return valid;
  } catch (err) {
    console.warn('Worker non raggiungibile, uso i dati di esempio.', err);
    statusEl.textContent = 'dati di esempio (Worker non raggiungibile)';
    return MOCK_CITIES;
  }
}

const stage = document.getElementById('stage');
const svg = d3.select('svg');
const card = document.getElementById('card');
let width = stage.clientWidth, height = stage.clientHeight;
const baseRadius = Math.min(width, height) * 0.31;

svg.attr('width', width).attr('height', height);

const projection = d3.geoOrthographic()
  .scale(baseRadius)
  .translate([width/2, height/2])
  .rotate([0, -15]);

const path = d3.geoPath(projection);

const defs = svg.append('defs');
const grad = defs.append('radialGradient').attr('id','oceanGrad').attr('cx','35%').attr('cy','30%');
grad.append('stop').attr('offset','0%').attr('stop-color','#eef2fb');
grad.append('stop').attr('offset','100%').attr('stop-color','#dbe4f7');

const g = svg.append('g').attr('class','sphere-shadow');

const oceanCircle = g.append('circle')
  .attr('cx', width/2).attr('cy', height/2).attr('r', baseRadius)
  .attr('fill','url(#oceanGrad)');

const graticulePath = g.append('path')
  .datum(d3.geoGraticule()())
  .attr('class','graticule')
  .attr('d', path);

const landGroup = g.append('g');
const markerGroup = g.append('g');
let selectedCity = null; // when set, globe is locked (no rotation)
let dragging = false;
let currentScale = baseRadius;
let CITIES = [];

Promise.all([
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
  loadCities()
]).then(([world, cities]) => {
  const land = topojson.feature(world, world.objects.countries);
  landGroup.selectAll('path')
    .data(land.features)
    .join('path')
    .attr('class','land')
    .attr('d', path);

  CITIES = cities;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('cityCount').textContent = CITIES.length + ' città in itinerario';
  drawMarkers();
});

function visiblePoint(d){
  const rotate = projection.rotate();
  const center = [-rotate[0], -rotate[1]];
  const dist = d3.geoDistance([d.lng, d.lat], center);
  return dist < Math.PI / 2;
}

function drawMarkers(){
  const sel = markerGroup.selectAll('g.marker')
    .data(CITIES, d => d.city)
    .join('g')
    .attr('class','marker')
    .on('click', (event, d) => { event.stopPropagation(); selectCity(d); });

  sel.selectAll('*').remove();
  sel.append('circle').attr('class','halo').attr('r', 12);
  sel.append('circle').attr('class','core').attr('r', 5);

  positionMarkers();
}

function positionMarkers(){
  markerGroup.selectAll('g.marker')
    .attr('transform', d => {
      const p = projection([d.lng, d.lat]);
      return `translate(${p[0]},${p[1]})`;
    })
    .style('display', d => visiblePoint(d) ? null : 'none');
}

function redraw(){
  oceanCircle.attr('r', currentScale);
  graticulePath.attr('d', path);
  landGroup.selectAll('path').attr('d', path);
  positionMarkers();
  if (selectedCity) positionCard(selectedCity);
}

function selectCity(d){
  selectedCity = d;
  markerGroup.selectAll('g.marker').classed('active', m => m.city === d.city);

  const barsHtml = d.types.map(([t,p]) =>
    `<span style="width:${p}%;background:${TYPE_COLORS[t] || '#ccc'}"></span>`).join('');
  const legendHtml = d.types.map(([t,p]) =>
    `<div class="legend-item"><span class="dot" style="background:${TYPE_COLORS[t] || '#ccc'}"></span>${t}<span class="val">${p}%</span></div>`).join('');

  card.innerHTML = `
    <div class="top">
      <div>
        <h2>${d.city}</h2>
        <div class="country">${d.country || ''}</div>
      </div>
      <div class="chip">In itinerario</div>
    </div>
    <div class="stats">
      <div><div class="stat-label">Prima visita</div><div class="stat-value">${d.firstVisit || '—'}</div></div>
      <div><div class="stat-label">Attività</div><div class="stat-value">${d.activities}</div></div>
    </div>
    <div class="section-label">Per tipo di attività</div>
    <div class="bar">${barsHtml}</div>
    <div class="legend">${legendHtml}</div>
    <div class="footnote">${WORKER_URL ? '' : 'Dati di esempio — collega il Worker per i dati live'}</div>
  `;
  positionCard(d);
  card.classList.add('visible');
}

function positionCard(d){
  const p = projection([d.lng, d.lat]);
  let left = p[0] + 24;
  let top = p[1] - 10;
  if (left + 300 > width) left = p[0] - 324;
  if (top + 340 > height) top = height - 350;
  if (top < 20) top = 20;
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}

function deselect(){
  selectedCity = null;
  card.classList.remove('visible');
  markerGroup.selectAll('g.marker').classed('active', false);
}

svg.on('click', () => deselect());

// --- combined drag-to-rotate + pinch/wheel-to-zoom ---
let prevTransform = d3.zoomIdentity;

const zoomBehavior = d3.zoom()
  .scaleExtent([0.6, 4])
  .on('start', (event) => {
    if (event.sourceEvent && event.sourceEvent.touches && event.sourceEvent.touches.length < 2 && !selectedCity){
      dragging = true;
    }
  })
  .on('zoom', (event) => {
    const t = event.transform;
    const se = event.sourceEvent;
    if (!se){ prevTransform = t; return; }

    const isPinch = se.touches && se.touches.length > 1;

    if (isPinch || se.type === 'wheel'){
      currentScale = baseRadius * t.k;
      projection.scale(currentScale);
      redraw();
    } else if (!selectedCity){
      // singolo puntatore: ruota il globo, ma solo se nulla è selezionato
      const dx = t.x - prevTransform.x;
      const dy = t.y - prevTransform.y;
      const rotate = projection.rotate();
      const k = 0.35;
      projection.rotate([rotate[0] + dx * k, rotate[1] - dy * k]);
      redraw();
    }
    prevTransform = t;
  })
  .on('end', () => { dragging = false; });

svg.call(zoomBehavior);

// rotazione automatica lenta, in pausa durante il trascinamento o con una card aperta
d3.timer(() => {
  if (dragging || selectedCity) return;
  const rotate = projection.rotate();
  projection.rotate([rotate[0] + 0.05, rotate[1]]);
  redraw();
});
</script>
</body>
</html>
