<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riviste in abbonamento</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .wrap {
    position: relative;
    background: #edf1f2;
    border-radius: 14px;
    padding: 28px 40px;
    min-height: 300px;
  }
  .slide { display: none; }
  .slide.active { display: block; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .title-block h2 {
    margin: 0 0 4px 0;
    font-size: 26px;
    font-weight: 700;
    color: #37352f;
  }
  .title-block .genere {
    font-size: 13px;
    color: #9b9a97;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .badge.attivo { background: #dff3ea; color: #1e7e5a; }
  .badge.scaduto { background: #fbe4e1; color: #a5311f; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 28px;
  }
  .info-item {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 6px 0;
    font-size: 13px;
  }
  .info-item .label { color: #9b9a97; }
  .info-item .value { color: #37352f; font-weight: 600; text-align: right; }
  .info-item .value a { color: #c0392b; text-decoration: none; }

  .highlight-row {
    display: flex;
    gap: 16px;
    margin-top: 18px;
  }
  .highlight-card {
    flex: 1;
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .highlight-card .label { font-size: 11px; color: #9b9a97; text-transform: uppercase; letter-spacing: 0.03em; }
  .highlight-card .value { font-size: 20px; font-weight: 700; color: #c0392b; margin-top: 4px; }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    color: #37352f;
  }
  .arrow.prev { left: 8px; }
  .arrow.next { right: 8px; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #37352f; opacity: 0.3; cursor: pointer; }
  .dot.active { opacity: 1; background: #c0392b; }

  .error, .empty { text-align: center; color: #6b6b6b; font-size: 13px; padding: 60px 0; }

  @media (max-width: 560px) {
    .info-grid { grid-template-columns: 1fr; }
    .highlight-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="wrap" id="dashboard">
  <div class="empty">Caricamento…</div>
</div>

<script>
  const WORKER_URL = "https://worker-riviste.daniele-470.workers.dev";

  let items = [];
  let current = 0;

  async function load() {
    const el = document.getElementById("dashboard");
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (!Array.isArray(data) || data.length === 0) {
        el.innerHTML = '<div class="empty">Nessuna rivista trovata</div>';
        return;
      }
      items = data;
      render();
    } catch (err) {
      el.innerHTML = '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function render() {
    const el = document.getElementById("dashboard");
    el.innerHTML = "";

    items.forEach((item, i) => {
      const slide = document.createElement("div");
      slide.className = "slide" + (i === current ? " active" : "");

      const badgeClass = item.statoAbbonamento === "Attivo" ? "attivo" : "scaduto";

      slide.innerHTML =
        '<div class="top-row">' +
          '<div class="title-block">' +
            '<h2>' + esc(item.nome) + '</h2>' +
            '<div class="genere">' + esc(item.genere) + '</div>' +
          '</div>' +
          '<span class="badge ' + badgeClass + '">' + esc(item.statoAbbonamento || "—") + '</span>' +
        '</div>' +

        '<div class="highlight-row">' +
          '<div class="highlight-card"><div class="label">Numero attuale</div><div class="value">N. ' + (item.numeroCorrente ?? "—") + '</div></div>' +
          '<div class="highlight-card"><div class="label">Prossima uscita</div><div class="value">' + formatDate(item.prossimaUscita) + '</div></div>' +
          '<div class="highlight-card"><div class="label">Scadenza abbonamento</div><div class="value">' + formatDate(item.scadenzaAbbonamento) + '</div></div>' +
        '</div>' +

        '<div class="info-grid" style="margin-top:18px">' +
          infoItem("Direttore", item.direttore) +
          infoItem("Editore", item.editore) +
          infoItem("Fondazione", formatDate(item.fondazione)) +
          infoItem("Periodicità", item.periodicita) +
          infoItem("Lingua", item.lingua) +
          infoItem("ISSN cartaceo", item.issnCartaceo) +
          infoItem("ISSN digitale", item.issnDigitale) +
          infoItem("Sito web", item.sitoWeb ? '<a href="' + item.sitoWeb + '" target="_blank">' + item.sitoWeb.replace(/^https?:\/\//, "") + '</a>' : "—") +
        '</div>';

      el.appendChild(slide);
    });

    if (items.length > 1) {
      const prevBtn = document.createElement("button");
      prevBtn.className = "arrow prev";
      prevBtn.textContent = "‹";
      prevBtn.onclick = () => go(current - 1);
      el.appendChild(prevBtn);

      const nextBtn = document.createElement("button");
      nextBtn.className = "arrow next";
      nextBtn.textContent = "›";
      nextBtn.onclick = () => go(current + 1);
      el.appendChild(nextBtn);

      const dots = document.createElement("div");
      dots.className = "dots";
      items.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = "dot" + (i === current ? " active" : "");
        dot.onclick = () => go(i);
        dots.appendChild(dot);
      });
      el.appendChild(dots);
    }
  }

  function infoItem(label, value) {
    return '<div class="info-item"><span class="label">' + label + '</span><span class="value">' + (value || "—") + '</span></div>';
  }

  function go(index) {
    current = (index + items.length) % items.length;
    render();
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
  }

  function esc(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  load();
</script>

</body>
</html>
