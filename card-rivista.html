<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheda rivista</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .card {
    background: #edf1f2;
    border-radius: 14px;
    padding: 28px 32px;
    min-height: 260px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .title-block h2 {
    margin: 0 0 4px 0;
    font-size: 26px;
    font-weight: 700;
    color: #37352f;
  }
  .title-block .genere {
    font-size: 13px;
    color: #9b9a97;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .badge.attivo { background: #dff3ea; color: #1e7e5a; }
  .badge.scaduto { background: #fbe4e1; color: #a5311f; }

  .highlight-row {
    display: flex;
    gap: 16px;
    margin-bottom: 18px;
  }
  .highlight-card {
    flex: 1;
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .highlight-card .label { font-size: 11px; color: #9b9a97; text-transform: uppercase; letter-spacing: 0.03em; }
  .highlight-card .value { font-size: 20px; font-weight: 700; color: #c0392b; margin-top: 4px; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 28px;
  }
  .info-item {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 6px 0;
    font-size: 13px;
  }
  .info-item .label { color: #9b9a97; }
  .info-item .value { color: #37352f; font-weight: 600; text-align: right; }
  .info-item .value a { color: #c0392b; text-decoration: none; }

  .error, .empty { text-align: center; color: #6b6b6b; font-size: 13px; padding: 60px 0; }

  @media (max-width: 520px) {
    .info-grid { grid-template-columns: 1fr; }
    .highlight-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="empty">Caricamento…</div>
</div>

<script>
  const WORKER_URL = "https://worker-riviste.daniele-470.workers.dev";

  // Il nome della rivista da mostrare arriva dal parametro ?rivista= nell'URL
  // di embed, cosi' la stessa pagina serve per Le Scienze e per Asimmetrie.
  const params = new URLSearchParams(window.location.search);
  const nomeRivista = params.get("rivista");

  async function load() {
    const el = document.getElementById("card");

    if (!nomeRivista) {
      el.innerHTML = '<div class="error">Manca il parametro ?rivista= nell\'URL di embed</div>';
      return;
    }

    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const item = data.find((r) => r.nome === nomeRivista);
      if (!item) {
        el.innerHTML = '<div class="empty">Nessuna rivista trovata con nome "' + esc(nomeRivista) + '"</div>';
        return;
      }
      render(item);
    } catch (err) {
      el.innerHTML = '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function render(item) {
    const el = document.getElementById("card");
    const badgeClass = item.statoAbbonamento === "Attivo" ? "attivo" : "scaduto";

    el.innerHTML =
      '<div class="top-row">' +
        '<div class="title-block">' +
          '<h2>' + esc(item.nome) + '</h2>' +
          '<div class="genere">' + esc(item.genere) + '</div>' +
        '</div>' +
        '<span class="badge ' + badgeClass + '">' + esc(item.statoAbbonamento || "—") + '</span>' +
      '</div>' +

      '<div class="highlight-row">' +
        '<div class="highlight-card"><div class="label">Numero attuale</div><div class="value">N. ' + (item.numeroCorrente ?? "—") + '</div></div>' +
        '<div class="highlight-card"><div class="label">Prossima uscita</div><div class="value">' + formatDate(item.prossimaUscita) + '</div></div>' +
        '<div class="highlight-card"><div class="label">Scadenza abbonamento</div><div class="value">' + formatDate(item.scadenzaAbbonamento) + '</div></div>' +
      '</div>' +

      '<div class="info-grid">' +
        infoItem("Direttore", item.direttore) +
        infoItem("Editore", item.editore) +
        infoItem("Fondazione", formatDate(item.fondazione)) +
        infoItem("Periodicità", item.periodicita) +
        infoItem("Lingua", item.lingua) +
        infoItem("ISSN cartaceo", item.issnCartaceo) +
        infoItem("ISSN digitale", item.issnDigitale) +
        infoItem("Sito web", item.sitoWeb ? '<a href="' + item.sitoWeb + '" target="_blank">' + item.sitoWeb.replace(/^https?:\/\//, "") + '</a>' : "—") +
      '</div>';
  }

  function infoItem(label, value) {
    return '<div class="info-item"><span class="label">' + label + '</span><span class="value">' + (value || "—") + '</span></div>';
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
  }

  function esc(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  load();
</script>

</body>
</html>
