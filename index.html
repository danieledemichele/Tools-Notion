<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiche libreria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel {
    background: linear-gradient(180deg, #f9f8f6 0%, #f3f1ee 100%);
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.06);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #37352f;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-row {
    display: flex;
    gap: 10px;
  }
  .mini-card {
    flex: 1;
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .mini-label {
    font-size: 10.5px;
    color: #9b9a97;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .mini-value {
    font-size: 19px;
    font-weight: 800;
    color: #37352f;
  }

  .stato-block {
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .stato-label {
    font-size: 10.5px;
    color: #9b9a97;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .stato-mini {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .stato-mini .col { text-align: left; }
  .stato-mini .num { font-size: 16px; font-weight: 800; color: #37352f; }
  .stato-mini .lbl { font-size: 9px; color: #9b9a97; font-weight: 600; text-transform: uppercase; }

  .goal-block {
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .goal-label { font-size: 10.5px; color: #9b9a97; font-weight: 600; margin-bottom: 6px; }
  .goal-value { font-size: 17px; font-weight: 800; color: #37352f; margin-bottom: 7px; }
  .progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #e0574a, #a5311f); border-radius: 3px; transition: width 0.4s ease; }
  .progress-percent { font-size: 10px; color: #9b9a97; margin-top: 4px; }

  .updated { font-size: 11px; color: #9b9a97; margin-top: 10px; text-align: right; }
  .error { color: #eb5757; font-size: 13px; }
</style>
</head>
<body>

<div class="grid" id="cards">
  <div class="panel">
    <div class="panel-title">📚 Libri</div>

    <div class="mini-row">
      <div class="mini-card"><div class="mini-label">Libri letti (anno)</div><div class="mini-value" data-field="libriLetti">…</div></div>
      <div class="mini-card"><div class="mini-label">Pagine anno</div><div class="mini-value" data-field="pagineAnno">…</div></div>
    </div>

    <div class="stato-block">
      <div class="stato-label">Stato libreria</div>
      <div class="stato-mini">
        <div class="col"><div class="num" data-field="daLeggere">…</div><div class="lbl">Da leggere</div></div>
        <div class="col"><div class="num" data-field="inLettura">…</div><div class="lbl">In lettura</div></div>
        <div class="col"><div class="num" data-field="completati">…</div><div class="lbl">Completati</div></div>
      </div>
    </div>

    <div class="goal-block">
      <div class="goal-label">Obiettivo lettura</div>
      <div class="goal-value" data-field="goalLabel">…</div>
      <div class="progress-track"><div class="progress-fill" data-field="goalBar" style="width:0%"></div></div>
      <div class="progress-percent" data-field="goalPercent"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">📰 Articoli</div>

    <div class="mini-row">
      <div class="mini-card"><div class="mini-label">Articoli letti (anno)</div><div class="mini-value" data-field="articoliAnno">…</div></div>
      <div class="mini-card"><div class="mini-label">Articoli totali</div><div class="mini-value" data-field="articoliTotali">…</div></div>
    </div>
  </div>
</div>

<div class="updated" id="updated"></div>

<script>
  const WORKER_URL = "https://libreria-stats.daniele-470.workers.dev";

  async function loadStats() {
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      setField("libriLetti", data.libriLetti);
      setField("pagineAnno", data.pagineAnno.toLocaleString("it-IT"));
      setField("articoliAnno", data.articoliAnno);
      setField("articoliTotali", data.articoliTotali);

      setField("daLeggere", data.statoLibreria.daLeggere);
      setField("inLettura", data.statoLibreria.inLettura);
      setField("completati", data.statoLibreria.completati);

      setField("goalLabel", data.goalProgress + " / " + data.goalTarget + " libri");
      setField("goalPercent", data.goalPercent + "%");
      document.querySelector('[data-field="goalBar"]').style.width = data.goalPercent + "%";

      const updatedEl = document.getElementById("updated");
      const d = new Date(data.aggiornato);
      updatedEl.textContent = "Aggiornato: " + d.toLocaleString("it-IT");
    } catch (err) {
      document.body.innerHTML =
        '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function setField(name, value) {
    const el = document.querySelector('[data-field="' + name + '"]');
    if (el) el.textContent = value;
  }

  loadStats();
</script>

</body>
</html>
