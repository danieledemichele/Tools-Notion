<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiche libreria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  .card {
    background: linear-gradient(180deg, #f9f8f6 0%, #f3f1ee 100%);
    border-radius: 10px;
    padding: 14px 14px;
    border: 1px solid rgba(0,0,0,0.06);
    min-width: 0;
  }
  .label {
    font-size: 11.5px;
    color: #9b9a97;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .value {
    font-size: 21px;
    font-weight: 800;
    color: #37352f;
  }

  .stato-mini { display: flex; justify-content: space-between; gap: 6px; }
  .stato-mini .col { text-align: left; }
  .stato-mini .num { font-size: 16px; font-weight: 800; color: #37352f; }
  .stato-mini .lbl { font-size: 9.5px; color: #9b9a97; font-weight: 600; text-transform: uppercase; }

  .goal-value { font-size: 20px; font-weight: 800; color: #37352f; margin-bottom: 7px; }
  .progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #e0574a, #a5311f); border-radius: 3px; transition: width 0.4s ease; }
  .progress-percent { font-size: 10.5px; color: #9b9a97; margin-top: 4px; }

  .updated { font-size: 11px; color: #9b9a97; margin-top: 8px; text-align: right; }
  .error { color: #eb5757; font-size: 13px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="grid" id="cards">
  <div class="card"><div class="label">Libri letti (anno)</div><div class="value" data-field="libriLetti">…</div></div>
  <div class="card"><div class="label">Pagine anno</div><div class="value" data-field="pagineAnno">…</div></div>
  <div class="card"><div class="label">Articoli letti (anno)</div><div class="value" data-field="articoliAnno">…</div></div>
  <div class="card"><div class="label">Articoli totali</div><div class="value" data-field="articoliTotali">…</div></div>
  <div class="card">
    <div class="label">Stato libreria</div>
    <div class="stato-mini">
      <div class="col"><div class="num" data-field="daLeggere">…</div><div class="lbl">Da leggere</div></div>
      <div class="col"><div class="num" data-field="inLettura">…</div><div class="lbl">In lettura</div></div>
      <div class="col"><div class="num" data-field="completati">…</div><div class="lbl">Completati</div></div>
    </div>
  </div>
  <div class="card">
    <div class="label">Obiettivo lettura</div>
    <div class="goal-value" data-field="goalLabel">…</div>
    <div class="progress-track"><div class="progress-fill" data-field="goalBar" style="width:0%"></div></div>
    <div class="progress-percent" data-field="goalPercent"></div>
  </div>
</div>
<div class="updated" id="updated"></div>

<script>
  const WORKER_URL = "https://SOSTITUISCI-CON-IL-TUO-WORKER.workers.dev";

  async function loadStats() {
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      setField("libriLetti", data.libriLetti);
      setField("pagineAnno", data.pagineAnno.toLocaleString("it-IT"));
      setField("articoliAnno", data.articoliAnno);
      setField("articoliTotali", data.articoliTotali);

      setField("daLeggere", data.statoLibreria.daLeggere);
      setField("inLettura", data.statoLibreria.inLettura);
      setField("completati", data.statoLibreria.completati);

      setField("goalLabel", data.goalProgress + " / " + data.goalTarget + " libri");
      setField("goalPercent", data.goalPercent + "%");
      document.querySelector('[data-field="goalBar"]').style.width = data.goalPercent + "%";

      const updatedEl = document.getElementById("updated");
      const d = new Date(data.aggiornato);
      updatedEl.textContent = "Aggiornato: " + d.toLocaleString("it-IT");
    } catch (err) {
      document.body.innerHTML =
        '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function setField(name, value) {
    const el = document.querySelector('[data-field="' + name + '"]');
    if (el) el.textContent = value;
  }

  loadStats();
  // setInterval(loadStats, 5 * 60 * 1000); // ogni 5 minuti, se vuoi refresh periodico
</script>

</body>
</html>
