<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiche libreria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .section { margin-bottom: 16px; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9b9a97;
    margin: 0 0 8px 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .grid.two { grid-template-columns: repeat(2, 1fr); }

  .card {
    background: linear-gradient(180deg, #f9f8f6 0%, #f3f1ee 100%);
    border-radius: 10px;
    padding: 16px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .label {
    font-size: 12px;
    color: #9b9a97;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .value {
    font-size: 23px;
    font-weight: 800;
    color: #37352f;
  }
  .value.accent {
    background: linear-gradient(135deg, #e0574a, #a5311f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .goal-value { font-size: 22px; font-weight: 800; color: #37352f; margin-bottom: 8px; }
  .progress-track { width: 100%; height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #e0574a, #a5311f); border-radius: 3px; transition: width 0.4s ease; }
  .progress-percent { font-size: 11px; color: #9b9a97; margin-top: 4px; }

  .rank-list { background: linear-gradient(180deg, #f9f8f6 0%, #f3f1ee 100%); border: 1px solid rgba(0,0,0,0.06); border-radius: 10px; padding: 14px 16px; }
  .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 13px; border-bottom: 1px solid rgba(0,0,0,0.05); }
  .rank-item:last-child { border-bottom: none; }
  .rank-item .name { color: #37352f; font-weight: 600; }
  .rank-item .count { color: #c0392b; font-weight: 700; font-size: 12px; background: #fbe6e3; padding: 2px 8px; border-radius: 10px; }
  .rank-empty { font-size: 12px; color: #9b9a97; padding: 8px 0; }

  .updated { font-size: 11px; color: #9b9a97; margin-top: 4px; text-align: right; }
  .error { color: #eb5757; font-size: 13px; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .rank-columns { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<div class="section">
  <div class="grid" id="main-cards">
    <div class="card"><div class="label">Libri letti (anno)</div><div class="value" data-field="libriLetti">…</div></div>
    <div class="card"><div class="label">Pagine anno</div><div class="value" data-field="pagineAnno">…</div></div>
    <div class="card"><div class="label">Articoli</div><div class="value" data-field="articoliTotali">…</div></div>
    <div class="card">
      <div class="label">Obiettivo lettura</div>
      <div class="goal-value" data-field="goalLabel">…</div>
      <div class="progress-track"><div class="progress-fill" data-field="goalBar" style="width:0%"></div></div>
      <div class="progress-percent" data-field="goalPercent"></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Ritmo di lettura</div>
  <div class="grid two">
    <div class="card"><div class="label">Pagine al giorno (media anno)</div><div class="value accent" data-field="pagineGiorno">…</div></div>
    <div class="card"><div class="label">Giorni medi per libro</div><div class="value accent" data-field="giorniPerLibro">…</div></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Stato della libreria</div>
  <div class="grid">
    <div class="card"><div class="label">In lettura</div><div class="value" data-field="inLettura">…</div></div>
    <div class="card"><div class="label">Da leggere</div><div class="value" data-field="daLeggere">…</div></div>
    <div class="card"><div class="label">Letti</div><div class="value" data-field="letti">…</div></div>
    <div class="card"><div class="label">Abbandonati</div><div class="value" data-field="abbandonati">…</div></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Classifiche</div>
  <div class="grid two rank-columns">
    <div>
      <div class="label" style="margin-bottom:8px">Autori più letti</div>
      <div class="rank-list" id="top-autori"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px">Testate più lette</div>
      <div class="rank-list" id="top-testate"></div>
    </div>
  </div>
</div>

<div class="updated" id="updated"></div>

<script>
  const WORKER_URL = "https://libreria-stats.daniele-470.workers.dev";

  async function loadStats() {
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      setField("libriLetti", data.libriLetti);
      setField("pagineAnno", data.pagineAnno.toLocaleString("it-IT"));
      setField("articoliTotali", data.articoliTotali);
      setField("goalLabel", data.goalProgress + " / " + data.goalTarget + " libri");
      setField("goalPercent", data.goalPercent + "%");
      document.querySelector('[data-field="goalBar"]').style.width = data.goalPercent + "%";

      setField("pagineGiorno", data.pace.pagineGiorno);
      setField("giorniPerLibro", data.pace.giorniPerLibro !== null ? data.pace.giorniPerLibro + " gg" : "—");

      setField("inLettura", data.statoLibreria.inLettura);
      setField("daLeggere", data.statoLibreria.daLeggere);
      setField("letti", data.statoLibreria.letti);
      setField("abbandonati", data.statoLibreria.abbandonati);

      renderRanking("top-autori", data.topAutori);
      renderRanking("top-testate", data.topTestate);

      const updatedEl = document.getElementById("updated");
      const d = new Date(data.aggiornato);
      updatedEl.textContent = "Aggiornato: " + d.toLocaleString("it-IT");
    } catch (err) {
      document.body.innerHTML =
        '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function setField(name, value) {
    const el = document.querySelector('[data-field="' + name + '"]');
    if (el) el.textContent = value;
  }

  function renderRanking(containerId, items) {
    const el = document.getElementById(containerId);
    if (!items || items.length === 0) {
      el.innerHTML = '<div class="rank-empty">Nessun dato disponibile</div>';
      return;
    }
    el.innerHTML = items
      .map((item) => '<div class="rank-item"><span class="name">' + esc(item.nome) + '</span><span class="count">' + item.count + '</span></div>')
      .join("");
  }

  function esc(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  loadStats();
  // setInterval(loadStats, 5 * 60 * 1000); // ogni 5 minuti, se vuoi refresh periodico
</script>

</body>
</html>
