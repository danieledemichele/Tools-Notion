<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Riepilogo di viaggio</title>
<style>
  :root{
    --bg:#f6f5f2;
    --ink:#16181c;
    --ink-dim:#8b8f97;
    --accent:#ff6f4d;
    --accent-soft:#ffe6de;
    --ocean-a:#eef2fb;
    --ocean-b:#dbe4f7;
    --card-bg:#ffffff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font);color:var(--ink);}
  #wrap{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px 26px;
    background:linear-gradient(160deg, var(--ocean-a), var(--ocean-b) 70%, var(--bg));
  }
  h1{font-size:15px;font-weight:600;margin:0 0 4px 0;}
  .subtitle{font-size:12px;color:var(--ink-dim);margin:0 0 18px 0;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    background:var(--card-bg);
    border-radius:14px;
    padding:16px 16px 14px 16px;
    box-shadow:0 10px 24px rgba(20,30,40,0.08);
  }
  .tile .value{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;}
  .tile .label{font-size:11px;color:var(--ink-dim);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}
  .tile.accent{background:var(--accent-soft);}
  .tile.accent .value{color:var(--accent);}

  #topType{
    margin-top:14px;
    background:var(--card-bg);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 10px 24px rgba(20,30,40,0.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #topType .label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;}
  #topType .value{font-size:14px;font-weight:600;}

  #status{font-size:10.5px;color:var(--ink-dim);margin-top:14px;font-style:italic;}
</style>
</head>
<body>
<div id="wrap">
  <h1>Riepilogo di viaggio</h1>
  

  <div class="grid">
    <div class="tile accent">
      <div class="value" id="citiesCount">—</div>
      <div class="label">Città visitate</div>
    </div>
    <div class="tile">
      <div class="value" id="countriesCount">—</div>
      <div class="label">Paesi</div>
    </div>
    <div class="tile">
      <div class="value" id="activitiesCount">—</div>
      <div class="label">Attività totali</div>
    </div>
    <div class="tile">
      <div class="value" id="avgActivities">—</div>
      <div class="label">Media per città</div>
    </div>
  </div>

  <div id="topType">
    <span class="label">Tipo più frequente</span>
    <span class="value" id="topTypeValue">—</span>
  </div>

  <div id="status"></div>
</div>

<script>
/* Stesso Worker usato dal globo — un solo posto da aggiornare se cambia URL */
const WORKER_URL = "https://travel-planner.daniele-470.workers.dev";

const MOCK_CITIES = [
  { city:"London", country:"United Kingdom", activities:12, types:[["Sightseeing",45],["Food",25],["Museum",20],["Shopping",10]] },
  { city:"Paris", country:"France", activities:18, types:[["Sightseeing",35],["Food",30],["Museum",25],["Shopping",10]] },
  { city:"Cagliari", country:"Italy", activities:22, types:[["Food",35],["Sightseeing",35],["Transport",15],["Museum",15]] }
];

async function loadStats(){
  let cities = MOCK_CITIES;
  let statusText = "dati di esempio — WORKER_URL non impostato";

  if (WORKER_URL) {
    try {
      const res = await fetch(WORKER_URL + "/cities");
      if (!res.ok) throw new Error("risposta non ok: " + res.status);
      cities = await res.json();
      statusText = "dati live da Notion";
    } catch (err) {
      statusText = "Worker non raggiungibile, uso i dati di esempio. " + err.message;
      console.warn(statusText);
    }
  }

  renderStats(cities);
  document.getElementById('status').textContent = statusText;
}

function renderStats(cities){
  const citiesCount = cities.length;
  const countries = new Set(cities.map(c => c.country).filter(Boolean));
  const totalActivities = cities.reduce((sum, c) => sum + (c.activities || 0), 0);
  const avg = citiesCount ? Math.round(totalActivities / citiesCount) : 0;

  const typeWeights = {};
  cities.forEach(c => {
    (c.types || []).forEach(([type, pct]) => {
      const weighted = (pct / 100) * (c.activities || 0);
      typeWeights[type] = (typeWeights[type] || 0) + weighted;
    });
  });
  let topType = "—";
  let topVal = 0;
  Object.entries(typeWeights).forEach(([type, val]) => {
    if (val > topVal) { topVal = val; topType = type; }
  });

  document.getElementById('citiesCount').textContent = citiesCount;
  document.getElementById('countriesCount').textContent = countries.size;
  document.getElementById('activitiesCount').textContent = totalActivities;
  document.getElementById('avgActivities').textContent = avg;
  document.getElementById('topTypeValue').textContent = topType;
}

loadStats();
</script>
</body>
</html>
