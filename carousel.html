<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letture recenti</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .wrap {
    position: relative;
    background: #edf1f2;
    border-radius: 12px;
    padding: 32px;
    min-height: 260px;
    overflow: hidden;
  }
  .slide {
    display: none;
    align-items: center;
    gap: 32px;
  }
  .slide.active {
    display: flex;
  }
  .cover {
    flex: 0 0 160px;
    height: 220px;
    border-radius: 6px;
    overflow: hidden;
    background: #37352f;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cover .badge-text {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    padding: 0 12px;
  }
  .cover .fallback-icon {
    font-size: 56px;
  }
  .content {
    flex: 1;
    min-width: 0;
  }
  .meta {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9b9a97;
    margin-bottom: 6px;
  }
  .title {
    font-size: 26px;
    font-weight: 700;
    color: #37352f;
    margin: 0 0 6px 0;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.5em;
  }
  .subtitle {
    font-size: 16px;
    font-weight: 700;
    color: #c0392b;
    margin: 0 0 10px 0;
  }
  .description {
    font-size: 14px;
    color: #6b6b6b;
    line-height: 1.5;
    margin: 0 0 16px 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cta {
    display: inline-block;
    background: #c0392b;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 18px;
    border-radius: 4px;
  }
  .cta:hover { background: #a5311f; }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.8);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    color: #37352f;
  }
  .arrow.prev { left: 8px; }
  .arrow.next { right: 8px; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 18px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #37352f;
    opacity: 0.3;
    cursor: pointer;
  }
  .dot.active {
    opacity: 1;
    background: #c0392b;
  }
  .error, .empty {
    color: #6b6b6b;
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }
  @media (max-width: 520px) {
    .slide { flex-direction: column; text-align: center; }
    .cover { flex-basis: 140px; height: 180px; }
    .title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="wrap" id="carousel">
  <div class="empty">Caricamento…</div>
</div>

<script>
  // Sostituisci con l'URL del worker "carosello" una volta creato
  const WORKER_URL = "https://libreria-carousel.daniele-470.workers.dev";

  let items = [];
  let current = 0;
  let autoplayTimer = null;
  const AUTOPLAY_MS = 5000;

  function startAutoplay() {
    stopAutoplay();
    autoplayTimer = setInterval(() => go(current + 1), AUTOPLAY_MS);
  }

  function stopAutoplay() {
    if (autoplayTimer) clearInterval(autoplayTimer);
  }

  async function load() {
    const el = document.getElementById("carousel");
    try {
      const res = await fetch(WORKER_URL);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (!Array.isArray(data) || data.length === 0) {
        el.innerHTML = '<div class="empty">Nessuna lettura recente trovata</div>';
        return;
      }
      items = data;
      render();
      startAutoplay();

      el.addEventListener("mouseenter", stopAutoplay);
      el.addEventListener("mouseleave", startAutoplay);
    } catch (err) {
      el.innerHTML = '<div class="error">Errore nel caricamento: ' + err.message + "</div>";
    }
  }

  function render() {
    const el = document.getElementById("carousel");
    el.innerHTML = "";

    items.forEach((item, i) => {
      const slide = document.createElement("div");
      slide.className = "slide" + (i === current ? " active" : "");

      const coverHtml = item.coverUrl
        ? '<img src="' + item.coverUrl + '" alt="">'
        : item.badgeText
        ? '<div class="badge-text">' + escapeHtml(item.badgeText) + "</div>"
        : '<div class="fallback-icon">' + item.fallbackIcon + "</div>";

      const descHtml = item.description
        ? '<div class="description">' + escapeHtml(item.description) + "</div>"
        : "";

      slide.innerHTML =
        '<div class="cover">' + coverHtml + "</div>" +
        '<div class="content">' +
          '<div class="meta">' + escapeHtml(item.meta) + "</div>" +
          '<div class="title">' + escapeHtml(item.title) + "</div>" +
          '<div class="subtitle">' + escapeHtml(item.subtitle) + "</div>" +
          descHtml +
          '<a class="cta" href="' + item.url + '" target="_blank">APRI IN NOTION</a>' +
        "</div>";

      el.appendChild(slide);
    });

    const prevBtn = document.createElement("button");
    prevBtn.className = "arrow prev";
    prevBtn.textContent = "‹";
    prevBtn.onclick = () => go(current - 1);
    el.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.className = "arrow next";
    nextBtn.textContent = "›";
    nextBtn.onclick = () => go(current + 1);
    el.appendChild(nextBtn);

    const dots = document.createElement("div");
    dots.className = "dots";
    items.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot" + (i === current ? " active" : "");
      dot.onclick = () => go(i);
      dots.appendChild(dot);
    });
    el.appendChild(dots);
  }

  function go(index) {
    current = (index + items.length) % items.length;
    render();
    startAutoplay(); // riavvia il timer ad ogni navigazione manuale
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  load();
  // Refresh automatico ogni 5 minuti (facoltativo):
  // setInterval(load, 5 * 60 * 1000);
</script>

</body>
</html>
